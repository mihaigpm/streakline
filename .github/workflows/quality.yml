name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ios:
    runs-on: macos-26
    defaults:
      run:
        working-directory: Streakline
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build Release
        run: |
          xcodebuild build \
            -project Streakline.xcodeproj \
            -scheme Streakline \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Test
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | \
            python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime in data.values() for d in runtime if d["name"].startswith("iPhone")))')"
          xcodebuild test \
            -project Streakline.xcodeproj \
            -scheme Streakline \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
