name: Streakline
options:
  bundleIdPrefix: com.mihaigarda
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: en
    # 1.0 is approved and closed. New uploads must stay above it.
    MARKETING_VERSION: "1.0.1"
    # Local archives use this number. Xcode Cloud overwrites it in
    # ci_scripts/ci_post_clone.sh with CI_BUILD_NUMBER and does not commit.
    CURRENT_PROJECT_VERSION: "4"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Streakline:
    type: application
    platform: iOS
    sources:
      - path: Streakline
    info:
      path: Streakline/Info.plist
      properties:
        CFBundleDisplayName: Streakline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mihaigarda.threshold
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone-only (portrait). Set at target level so it overrides xcodegen's 1,2 default.
        TARGETED_DEVICE_FAMILY: "1"
  StreaklineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StreaklineTests
    dependencies:
      - target: Streakline
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  StreaklineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StreaklineUITests
    dependencies:
      - target: Streakline
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mihaigarda.StreaklineUITests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Streakline
schemes:
  Streakline:
    build:
      targets:
        Streakline: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StreaklineTests
        - StreaklineUITests
    archive:
      config: Release
